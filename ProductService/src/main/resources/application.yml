server:
  port: 9002
spring:
  application:
    name: product-service
  
  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/productservice
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

  boot:
    admin:
      client:
        url:
        - http://localhost:1111
management:
  endpoints:
    web:
      exposure:
        include:
        - "*"

