<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <style>
    .bg{fill:#fafbfe}.title{font:700 31px Arial,sans-serif;fill:#102e68;letter-spacing:.5px}.subtitle{font:400 15px Arial,sans-serif;fill:#53627a}.box{fill:#fff;stroke:#26364d;stroke-width:1.5}.divider{stroke:#aeb8c8;stroke-width:1}.headRole{fill:#7d3fb2}.headUser{fill:#2878c9}.headProfile{fill:#08959d}.headText{font:700 20px Arial,sans-serif;fill:#fff;text-anchor:middle}.field{font:600 16px Arial,sans-serif;fill:#172337}.type{font:400 15px Arial,sans-serif;fill:#344158}.pk{fill:#c88400;font:700 14px Arial,sans-serif}.fk{fill:#0765c1;font:700 14px Arial,sans-serif}.rel{fill:none;stroke:#27384f;stroke-width:2.5}.label{font:700 15px Arial,sans-serif;fill:#172337}.cardTitle{font:700 18px Arial,sans-serif;fill:#102e68}.small{font:400 14px Arial,sans-serif;fill:#3f506a}.key{font:700 17px Arial,sans-serif;fill:#c88400}
  </style>
  <rect class="bg" width="1600" height="1000"/>
  <text x="800" y="58" class="title" text-anchor="middle">USER SERVICE DATABASE SCHEMA</text>
  <text x="800" y="84" class="subtitle" text-anchor="middle">Generated from the current JPA entity mappings</text>

  <!-- ROLE -->
  <rect class="box" x="110" y="190" width="415" height="235" rx="7"/>
  <path class="headRole" d="M117 190h401a7 7 0 0 1 7 7v48H110v-48a7 7 0 0 1 7-7z"/>
  <text x="317" y="222" class="headText">ROLE</text>
  <line x1="365" y1="245" x2="365" y2="425" class="divider"/>
  <text x="132" y="279" class="field">role_id</text><text x="265" y="279" class="key">⚿</text><text x="290" y="279" class="pk">PK</text><text x="385" y="279" class="type">INT</text>
  <text x="132" y="323" class="field">role_name</text><text x="290" y="323" class="type">ENUM</text><text x="385" y="323" class="type">RoleType</text>
  <line x1="130" y1="348" x2="505" y2="348" class="divider"/>
  <text x="132" y="379" class="small">Values: CUSTOMER, ADMIN, SALLER</text>
  <text x="132" y="404" class="small">One role can be assigned to many users</text>

  <!-- USER -->
  <rect class="box" x="735" y="135" width="475" height="390" rx="7"/>
  <path class="headUser" d="M742 135h461a7 7 0 0 1 7 7v48H735v-48a7 7 0 0 1 7-7z"/>
  <text x="972" y="167" class="headText">USER</text>
  <line x1="1040" y1="190" x2="1040" y2="525" class="divider"/>
  <text x="757" y="224" class="field">user_id</text><text x="888" y="224" class="key">⚿</text><text x="913" y="224" class="pk">PK</text><text x="1062" y="224" class="type">INT</text>
  <text x="757" y="267" class="field">email</text><text x="913" y="267" class="small">UNIQUE</text><text x="1062" y="267" class="type">VARCHAR</text>
  <text x="757" y="310" class="field">password</text><text x="1062" y="310" class="type">VARCHAR</text>
  <text x="757" y="353" class="field">created_at</text><text x="1062" y="353" class="type">DATETIME</text>
  <text x="757" y="396" class="field">modified_at</text><text x="1062" y="396" class="type">DATETIME</text>
  <text x="757" y="460" class="field" fill="#0765c1">role_id</text><text x="913" y="460" class="fk">FK</text><text x="1062" y="460" class="type">INT</text>
  <line x1="755" y1="482" x2="1190" y2="482" class="divider"/>
  <text x="757" y="510" class="small">role_id → ROLE.role_id</text>

  <!-- PROFILE -->
  <rect class="box" x="565" y="675" width="505" height="270" rx="7"/>
  <path class="headProfile" d="M572 675h491a7 7 0 0 1 7 7v48H565v-48a7 7 0 0 1 7-7z"/>
  <text x="817" y="707" class="headText">PROFILE</text>
  <line x1="888" y1="730" x2="888" y2="945" class="divider"/>
  <text x="587" y="764" class="field">profile_id</text><text x="747" y="764" class="key">⚿</text><text x="772" y="764" class="pk">PK</text><text x="910" y="764" class="type">INT</text>
  <text x="587" y="802" class="field">first_name</text><text x="910" y="802" class="type">VARCHAR</text>
  <text x="587" y="840" class="field">last_name</text><text x="910" y="840" class="type">VARCHAR</text>
  <text x="587" y="878" class="field">phone</text><text x="910" y="878" class="type">VARCHAR</text>
  <text x="587" y="916" class="field">dob</text><text x="910" y="916" class="type">DATE</text>
  <text x="587" y="938" class="small">image_url, image_public_id, user_id (FK + UNIQUE)</text>

  <!-- relationships -->
  <path d="M525 307 H650 V330 H735" class="rel"/>
  <path d="M720 321 l15 9 -15 9M720 339 l15 -9" class="rel"/>
  <line x1="545" y1="296" x2="545" y2="318" class="rel"/>
  <text x="562" y="286" class="label">1</text><text x="689" y="310" class="label">M</text>
  <text x="560" y="350" class="small">assigned to</text>

  <path d="M972 525 V600 H817 V675" class="rel"/>
  <line x1="805" y1="660" x2="829" y2="660" class="rel"/>
  <line x1="805" y1="668" x2="829" y2="668" class="rel"/>
  <line x1="960" y1="540" x2="984" y2="540" class="rel"/>
  <line x1="960" y1="548" x2="984" y2="548" class="rel"/>
  <text x="990" y="565" class="label">1</text><text x="835" y="650" class="label">1</text>
  <text x="840" y="584" class="small">has</text>

  <!-- legend -->
  <rect x="1120" y="695" width="355" height="210" rx="8" fill="#fff" stroke="#9aa8ba" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1150" y="733" class="cardTitle">LEGEND</text>
  <text x="1150" y="775" class="key">⚿</text><text x="1182" y="775" class="field">PK</text><text x="1265" y="775" class="small">Primary key</text>
  <text x="1150" y="817" class="fk">FK</text><text x="1182" y="817" class="field">FK</text><text x="1265" y="817" class="small">Foreign key</text>
  <text x="1150" y="859" class="label">1</text><text x="1182" y="859" class="small">One</text><text x="1295" y="859" class="label">M</text><text x="1323" y="859" class="small">Many</text>
  <text x="1150" y="888" class="small">USER ↔ PROFILE is one-to-one</text>
</svg>
