server:
  port: 9003

spring:
  application:
    name: OrderService

  datasource:
    url: jdbc:mysql://localhost:3306/orderservice
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

